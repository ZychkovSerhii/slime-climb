# Збирає debug-APK і кладе його в GitHub Release «apk-dev» (перезаписується при кожній збірці).
# Запуск: пуш у гілки feat/**, fix/** або main, чи вручну (Actions → Android APK → Run workflow).
name: Android APK

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build web and sync Android project
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          SHORT=$(git rev-parse --short HEAD)
          cp android/app/build/outputs/apk/debug/app-debug.apk "slime-climb-debug-${SHORT}.apk"
          echo "APK_FILE=slime-climb-debug-${SHORT}.apk" >> "$GITHUB_ENV"
          echo "SHORT=${SHORT}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: slime-climb-debug-apk
          path: ${{ env.APK_FILE }}

      - name: Publish to release apk-dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Debug-збірка для перевірки на телефоні (не для Google Play). Гілка ${GITHUB_REF_NAME}, коміт ${SHORT}."
          if gh release view apk-dev >/dev/null 2>&1; then
            for a in $(gh release view apk-dev --json assets --jq '.assets[].name'); do
              gh release delete-asset apk-dev "$a" --yes
            done
            gh release edit apk-dev --notes "$NOTES" --prerelease
          else
            gh release create apk-dev --prerelease --title "Slime Climb — debug APK" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload apk-dev "$APK_FILE" --clobber
