# Розгортає Worker таблиці лідерів (етап 12) на Cloudflare і застосовує схему D1.
# Потрібні секрети репозиторію CLOUDFLARE_API_TOKEN і CLOUDFLARE_ACCOUNT_ID (docs/leaderboard-setup.md).
# Без них workflow лише пише примітку і завершується успішно.
name: Leaderboard deploy

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/systems/LeaderboardRules.js'
      - 'src/systems/Profanity.js'
      - 'src/systems/Tuning.js'
      - 'src/config/balance.js'
      - '.github/workflows/leaderboard-deploy.yml'
  workflow_dispatch:

concurrency:
  group: leaderboard-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check secrets
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::notice::Немає секретів CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — розгортання пропущено (див. docs/leaderboard-setup.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Tests
        if: steps.check.outputs.ready == 'true'
        run: npm ci && npm test

      - name: Apply D1 schema
        if: steps.check.outputs.ready == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute slime-climb --remote --file schema.sql

      - name: Deploy Worker
        if: steps.check.outputs.ready == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
